<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GS Battery Inventory</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0; background: #f5f5f7; color: #1d1d1f;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  letter-spacing: -0.01em;
}
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
.pill { border: none; background: #0066cc; color: #fff; font-size: 13px; font-weight: 600;
  padding: 9px 18px; border-radius: 9999px; transition: transform .1s; }
.pill:active { transform: scale(.95); }
.pill:disabled { opacity: .4; }
.card { background: #fff; border: .5px solid #e0e0e0; border-radius: 12px; }
.field { width: 100%; border: .5px solid #e0e0e0; border-radius: 8px; padding: 9px 12px;
  font-size: 14px; font-family: inherit; background: #fff; }
.field:focus { border-color: #0066cc; outline: none; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 400; color: #7a7a7a; padding: 12px; border-bottom: .5px solid #e0e0e0; }
td { padding: 12px; border-bottom: .5px solid #e0e0e0; }
tr:last-child td { border-bottom: none; }
.mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
.muted { color: #7a7a7a; }
.nav { border: none; background: transparent; color: #1d1d1f; font-size: 13px;
  padding: 6px 14px; border-radius: 9999px; }
.nav.active { background: #0066cc; color: #fff; }
.lbl { font-size: 12px; color: #7a7a7a; display: block; margin-bottom: 6px; }
.err { color: #E24B4A; font-size: 13px; margin: 4px 0 0; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -.02em; }
h2 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
</style>
</head>
<body>
<div id="root"></div>
<script>
// ---- in-memory state (mirrors the seeded DB) ----
var state = {
  user: null,
  items: [
    { id: 1, sku: "BAT-12V-60",  name: "12V 60Ah Battery",  unit: "pcs", reorder_level: 5 },
    { id: 2, sku: "BAT-12V-100", name: "12V 100Ah Battery", unit: "pcs", reorder_level: 3 }
  ],
  movements: [
    { id: 1, item_id: 1, type: "in", change: 20, note: null, created_at: "2026-06-20T10:25:00" }
  ],
  nextItem: 3, nextMove: 2, screen: "dash", search: ""
};

// derived quantity = sum of a movement's changes (single source of truth, like the SQL view)
function qty(itemId) {
  return state.movements.filter(function(m){return m.item_id===itemId;})
    .reduce(function(s,m){return s+m.change;}, 0);
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]);}); }

function render(){
  var r = document.getElementById("root");
  r.innerHTML = state.user ? shell(screen()) : login();
  wire();
}

function login(){
  return '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px">'
    + '<form id="loginForm" class="card" style="width:100%;max-width:360px;padding:32px">'
    + '<h1>GS Battery Inventory</h1>'
    + '<p class="muted" style="font-size:14px;margin:6px 0 20px">Sign in to manage stock.</p>'
    + '<label class="lbl">Email</label><input id="email" class="field" type="email" value="admin@gsbattery.co.th" style="margin-bottom:14px" />'
    + '<label class="lbl">Password</label><input id="pw" class="field" type="password" value="admin123" style="margin-bottom:18px" />'
    + '<p id="loginErr" class="err" style="display:none"></p>'
    + '<button class="pill" style="width:100%" type="submit">Sign in</button>'
    + '<p class="muted" style="font-size:12px;margin:18px 0 0">Demo: admin@gsbattery.co.th / admin123 (admin) · staff@gsbattery.co.th / staff123 (staff)</p>'
    + '</form></div>';
}

function shell(inner){
  var n = function(id,label){ return '<button class="nav '+(state.screen===id?"active":"")+'" data-nav="'+id+'">'+label+'</button>'; };
  return '<header style="position:sticky;top:0;z-index:5;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:rgba(255,255,255,.92);border-bottom:.5px solid #e0e0e0;backdrop-filter:blur(8px)">'
    + '<div style="display:flex;align-items:center;gap:6px"><span style="font-weight:600;margin-right:10px">GS Battery</span>'
    + n("dash","Dashboard")+n("items","Items")+n("moves","Movements")+'</div>'
    + '<div style="display:flex;align-items:center;gap:12px"><span class="muted" style="font-size:13px">'+esc(state.user.name)+' · '+state.user.role+'</span>'
    + '<button id="logout" style="border:none;background:#1d1d1f;color:#fff;font-size:12px;padding:6px 12px;border-radius:8px">Sign out</button></div>'
    + '</header><main style="max-width:1000px;margin:0 auto;padding:28px 20px">'+inner+'</main>';
}

function screen(){
  if(state.screen==="items") return itemsScreen();
  if(state.screen==="moves") return movesScreen();
  return dashScreen();
}

function dashScreen(){
  var low = state.items.filter(function(i){return qty(i.id)<=i.reorder_level;});
  var rows = low.length ? low.map(function(i){
    return '<tr><td class="mono">'+esc(i.sku)+'</td><td>'+esc(i.name)+'</td>'
      + '<td style="font-weight:600;color:#E24B4A">'+qty(i.id)+'</td><td class="muted">'+i.reorder_level+'</td></tr>';
  }).join("") : '';
  return '<h1 style="margin-bottom:20px">Dashboard</h1>'
    + '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:28px">'
    + stat("Total items", state.items.length, false)
    + stat("Low stock", low.length, low.length>0)
    + '</div><h2>Low-stock items</h2>'
    + (low.length
        ? '<div class="card" style="overflow:hidden"><table><thead><tr><th>SKU</th><th>Name</th><th>Qty</th><th>Reorder &le;</th></tr></thead><tbody>'+rows+'</tbody></table></div>'
        : empty("All stocked up","No items at or below their reorder level."));
}
function stat(label,val,warn){
  return '<div class="card" style="padding:20px"><p class="muted" style="font-size:13px;margin:0">'+label+'</p>'
    + '<p style="font-size:28px;font-weight:700;margin:6px 0 0'+(warn?";color:#BA7517":"")+'">'+val+'</p></div>';
}
function empty(t,h){
  return '<div class="card" style="border-style:dashed;text-align:center;padding:48px 16px">'
    + '<p style="font-weight:600;font-size:14px;margin:0">'+t+'</p><p class="muted" style="font-size:13px;margin:6px 0 0">'+h+'</p></div>';
}

function itemsScreen(){
  var q = state.search.toLowerCase();
  var list = state.items.filter(function(i){ return !q || i.name.toLowerCase().indexOf(q)>=0 || i.sku.toLowerCase().indexOf(q)>=0; });
  var isAdmin = state.user.role==="admin";
  var rows = list.map(function(i){
    var qn = qty(i.id), low = qn<=i.reorder_level;
    return '<tr><td class="mono">'+esc(i.sku)+'</td><td>'+esc(i.name)+'</td><td class="muted">'+esc(i.unit)+'</td>'
      + '<td style="font-weight:600'+(low?";color:#E24B4A":"")+'">'+qn+'</td><td class="muted">'+i.reorder_level+'</td>'
      + (isAdmin?'<td style="text-align:right"><span data-del="'+i.id+'" style="color:#E24B4A;font-weight:600;cursor:pointer">Delete</span></td>':'')+'</tr>';
  }).join("");
  return '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px"><h1>Items</h1>'
    + '<button class="pill" id="toggleAdd">Add item</button></div>'
    + '<div id="addWrap"></div>'
    + '<input id="search" class="field" placeholder="Search by name or SKU…" value="'+esc(state.search)+'" style="max-width:280px;border-radius:9999px;padding:9px 18px;margin-bottom:16px" />'
    + (list.length
        ? '<div class="card" style="overflow:hidden"><table><thead><tr><th>SKU</th><th>Name</th><th>Unit</th><th>Qty</th><th>Reorder &le;</th>'+(isAdmin?'<th></th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'
        : empty("No items","Add your first item to start tracking stock."));
}
function addForm(){
  return '<form id="addForm" class="card" style="padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px">'
    + '<div><label class="lbl">SKU</label><input id="f_sku" class="field" required /></div>'
    + '<div><label class="lbl">Name</label><input id="f_name" class="field" required /></div>'
    + '<div><label class="lbl">Unit</label><input id="f_unit" class="field" value="pcs" /></div>'
    + '<div><label class="lbl">Reorder level</label><input id="f_re" class="field" type="number" min="0" value="0" /></div>'
    + '<p id="addErr" class="err" style="grid-column:1/3;display:none"></p>'
    + '<div style="grid-column:1/3"><button class="pill" type="submit">Save item</button></div></form>';
}

function movesScreen(){
  var opts = state.items.map(function(i){return '<option value="'+i.id+'">'+esc(i.sku)+' — '+esc(i.name)+'</option>';}).join("");
  var hist = state.movements.slice().sort(function(a,b){return b.id-a.id;}).map(function(m){
    var sku = (state.items.find(function(i){return i.id===m.item_id;})||{}).sku || ("#"+m.item_id);
    var pos = m.change>0;
    return '<tr><td class="muted">'+new Date(m.created_at).toLocaleString()+'</td><td class="mono">'+esc(sku)+'</td>'
      + '<td style="text-transform:capitalize">'+m.type+'</td>'
      + '<td style="font-weight:600;color:'+(pos?"#1D9E75":"#E24B4A")+'">'+(pos?"+":"")+m.change+'</td>'
      + '<td class="muted">'+(m.note?esc(m.note):"—")+'</td></tr>';
  }).join("");
  return '<h1 style="margin-bottom:18px">Stock movements</h1>'
    + '<form id="moveForm" class="card" style="padding:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;align-items:end;margin-bottom:16px">'
    + '<div><label class="lbl">Item</label><select id="m_item" class="field" required>'+opts+'</select></div>'
    + '<div><label class="lbl">Type</label><select id="m_type" class="field"><option value="in">In</option><option value="out">Out</option><option value="adjust">Adjust</option></select></div>'
    + '<div><label class="lbl" id="m_qlbl">Quantity</label><input id="m_qty" class="field" type="number" value="1" required /></div>'
    + '<div><label class="lbl">Note (optional)</label><input id="m_note" class="field" /></div>'
    + '<p id="moveErr" class="err" style="grid-column:1/-1;display:none"></p>'
    + '<div style="grid-column:1/-1"><button class="pill" type="submit">Record movement</button></div></form>'
    + (state.movements.length
        ? '<div class="card" style="overflow:hidden"><table><thead><tr><th>When</th><th>Item</th><th>Type</th><th>Change</th><th>Note</th></tr></thead><tbody>'+hist+'</tbody></table></div>'
        : empty("No movements yet","Record stock in or out above."));
}

// ---- events ----
function wire(){
  var lf = document.getElementById("loginForm");
  if(lf){ lf.onsubmit = function(e){ e.preventDefault();
    var em = document.getElementById("email").value.trim(), pw = document.getElementById("pw").value;
    var users = { "admin@gsbattery.co.th": {pw:"admin123", name:"Admin", role:"admin"},
                  "staff@gsbattery.co.th": {pw:"staff123", name:"Staff", role:"staff"} };
    var u = users[em];
    if(!u || u.pw!==pw){ var le=document.getElementById("loginErr"); le.style.display="block"; le.textContent="Invalid email or password"; return; }
    state.user = { email: em, name: u.name, role: u.role }; state.screen="dash"; render();
  }; return; }

  document.querySelectorAll("[data-nav]").forEach(function(b){ b.onclick=function(){ state.screen=b.getAttribute("data-nav"); render(); }; });
  var lo = document.getElementById("logout"); if(lo) lo.onclick=function(){ state.user=null; render(); };

  var ta = document.getElementById("toggleAdd");
  if(ta) ta.onclick=function(){ var w=document.getElementById("addWrap"); w.innerHTML = w.innerHTML ? "" : addForm(); ta.textContent = w.innerHTML ? "Close" : "Add item"; wireAdd(); };
  wireAdd();

  var s = document.getElementById("search");
  if(s) s.oninput=function(){ state.search=s.value; var w=document.getElementById("addWrap"); var open=w&&w.innerHTML; render(); if(open){document.getElementById("toggleAdd").click();} var ns=document.getElementById("search"); ns.focus(); ns.setSelectionRange(ns.value.length,ns.value.length); };

  document.querySelectorAll("[data-del]").forEach(function(x){ x.onclick=function(){
    var id=Number(x.getAttribute("data-del"));
    state.items=state.items.filter(function(i){return i.id!==id;});
    state.movements=state.movements.filter(function(m){return m.item_id!==id;}); // ON DELETE CASCADE
    render();
  }; });

  var mf = document.getElementById("moveForm");
  if(mf){
    var tsel=document.getElementById("m_type"), qlbl=document.getElementById("m_qlbl");
    tsel.onchange=function(){ qlbl.textContent = tsel.value==="adjust" ? "Delta (±)" : "Quantity"; };
    mf.onsubmit=function(e){ e.preventDefault();
      var itemId=Number(document.getElementById("m_item").value), type=tsel.value, q=Number(document.getElementById("m_qty").value), note=document.getElementById("m_note").value.trim();
      var err=document.getElementById("moveErr");
      function fail(msg){ err.style.display="block"; err.textContent=msg; }
      if(type==="adjust" ? q===0 : q<=0){ return fail(type==="adjust"?"adjust delta cannot be 0":type+" quantity must be positive"); }
      var change = type==="out" ? -Math.abs(q) : type==="in" ? Math.abs(q) : q;
      if(qty(itemId)+change < 0){ return fail("Insufficient stock: have "+qty(itemId)+", change "+change); }
      state.movements.push({ id: state.nextMove++, item_id:itemId, type:type, change:change, note:note||null, created_at:new Date().toISOString() });
      render();
    };
  }
}
function wireAdd(){
  var af = document.getElementById("addForm"); if(!af) return;
  af.onsubmit=function(e){ e.preventDefault();
    var sku=document.getElementById("f_sku").value.trim(), name=document.getElementById("f_name").value.trim();
    var unit=document.getElementById("f_unit").value.trim()||"pcs", re=Number(document.getElementById("f_re").value)||0;
    var err=document.getElementById("addErr");
    if(!sku||!name){ err.style.display="block"; err.textContent="SKU and name are required"; return; }
    if(state.items.some(function(i){return i.sku.toLowerCase()===sku.toLowerCase();})){ err.style.display="block"; err.textContent="SKU already exists"; return; }
    state.items.push({ id: state.nextItem++, sku:sku, name:name, unit:unit, reorder_level:re });
    render();
  };
}
render();
</script>
</body>
</html>
